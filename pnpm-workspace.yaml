packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to execute install scripts. pnpm blocks the rest by
# default; every entry here is a deliberate supply-chain decision.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@swc/core'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - esbuild
  # Native accelerator for Next.js build caching.
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver

# Single source of truth for dependency versions across the workspace.
# Add a version here and reference it with `catalog:` in package manifests.
catalog:
  '@nestjs/cli': '^12.0.5'
  '@nestjs/common': '^12.0.4'
  '@nestjs/core': '^12.0.4'
